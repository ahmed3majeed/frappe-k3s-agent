apiVersion: v1
kind: Pod
metadata:
  name: s3-download
  namespace: frappe-v15
spec:
  restartPolicy: Never
  containers:
    - name: s3-download
      image: amazon/aws-cli:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          mkdir -p /restore-target/s3-restore-test
          aws s3 cp s3://frappe-k3s-test-backups/test.local/ /restore-target/s3-restore-test/ --recursive --endpoint-url https://s3.eu-central-2.idrivee2.com
          echo "Download complete: $?"
          ls -la /restore-target/s3-restore-test/
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef: {name: idrive-e2-secret, key: access-key}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef: {name: idrive-e2-secret, key: secret-key}
        - name: AWS_DEFAULT_REGION
          value: "eu-central-2"
      volumeMounts:
        - name: bench-data
          mountPath: /restore-target
  volumes:
    - name: bench-data
      persistentVolumeClaim:
        claimName: bench-v15-data
