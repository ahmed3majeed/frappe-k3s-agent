apiVersion: v1
kind: Pod
metadata:
  name: s3-setup
  namespace: frappe-system
spec:
  restartPolicy: Never
  containers:
    - name: s3-setup
      image: amazon/aws-cli:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          aws s3 mb s3://frappe-k3s-test-backups --endpoint-url https://s3.eu-central-2.idrivee2.com 2>&1 || echo "Bucket already exists"
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: idrive-e2-secret
              key: access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: idrive-e2-secret
              key: secret-key
        - name: AWS_DEFAULT_REGION
          value: "eu-central-2"
